<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Product Page</title>
</head>
<body>
    <header>
        <h1>Current Discount: 10% off cart over ฿500</h1>
    </header>
    <section>
        <div class="topnav">
            <input id="product-search" type="search" placeholder="Search by name or ID..." aria-label="Search products by name or ID">
            <input type="checkbox" id="in-stock" name="in-stock" value="yes">
            <label for="in-stock">In Stock</label>
            <input type="checkbox" id="sort-by-price-low" name="sort-by-price-low" value="yes">
            <label for="sort-by-price-low">Sort by Price (Low to High)</label>
            <input type="checkbox" id="sort-by-price-high" name="sort-by-price-high" value="yes">
            <label for="sort-by-price-high">Sort by Price (High to Low)</label>
        </div>
    </section>
    <section>
        <p id="product-status" role="status" aria-live="polite">Loading products...</p>
        <ul class="product-list" id="product-list"></ul>
    </section>

    <section>
        <h2>Cart (<span id="cart-count">0</span>)</h2>
        <ul id="cart-items"></ul>
        <p>Subtotal: <span id="subtotal">฿0.00</span></p>
        <p>Discount: <span id="discount">฿0.00</span></p>
        <p><strong>Total: <span id="total-price">฿0.00</span></strong></p>
    </section>

    <section>
        <h2>Payment</h2>
        <label for="payment-amount">Amount paid</label>
        <input id="payment-amount" type="number" min="0" step="0.01" placeholder="0.00">
        <button id="calculate-change" type="button">Calculate Change</button>
        <p><strong>Change: <span id="change-amount">฿0.00</span></strong></p>
        <p id="payment-message" role="status" aria-live="polite"></p>
    </section>
    <script type="module" src="/src/app.js"></script>
</body>
</html>
